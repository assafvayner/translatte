[package]
name = "translatte-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "translatte"
path = "src/main.rs"

[dependencies]
translatte-core = { path = "../core", features = ["llama"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cosmic-text = "=0.12.1"
image.workspace = true
serde_json.workspace = true
strsim = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[workspace]
resolver = "2"
members = ["bergamot", "core", "cli", "ffi"]

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.25"
ndarray = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# llama-cpp-2 0.1.160 plus a ggml threadpool API (branch translatte/threadpool of the fork); core's
# `=0.1.160` requirement makes the patch fail loudly if they drift apart. llama-cpp-sys-2 comes
# from the same checkout.
[patch.crates-io]
llama-cpp-2 = { git = "https://github.com/assafvayner/llama-cpp-rs", rev = "3f15284c6762506516662680e6c12dd5bc645647" }

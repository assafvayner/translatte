# bergamot-translator (the `bergamot` crate) is built through CMake. Ninja avoids Apple make 3.81's
# jobserver hangs under cargo, and sccache caches the C/C++ objects across targets,
# profiles and worktrees. Requires `brew install ninja sccache`.
[env]
CMAKE_GENERATOR = "Ninja"
CMAKE_C_COMPILER_LAUNCHER = "sccache"
CMAKE_CXX_COMPILER_LAUNCHER = "sccache"

# Android 15+ devices may use 16 KB pages; pad RELRO to 16 KB too, not just the LOAD segments.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384", "-C", "link-arg=-Wl,-z,common-page-size=16384"]

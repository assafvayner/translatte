[package]
name = "translatte-core"
version = "0.1.0"
edition = "2021"

[features]
default = []
llama = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2", "dep:encoding_rs", "dep:self_cell"]
download = ["dep:hf-hub", "dep:tokio", "dep:serde_yaml_ng", "dep:futures", "dep:bytes"]
# TLS backend for `download`; enable exactly one. rustls is the production backend (on Android
# it verifies through rustls-platform-verifier, which the app initializes via JNI).
tls-rustls = ["hf-hub?/rustls-tls"]
# Test-only: OpenSSL-based TLS for running without JNI (the CLI over `adb shell`). On Android,
# native-tls trusts the system CAs by reading /system/etc/security/cacerts itself.
tls-native = ["hf-hub?/native-tls", "dep:openssl"]

[dependencies]
image.workspace = true
imageproc.workspace = true
ndarray.workspace = true
ort = "=2.0.0-rc.10"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Pinned: the threadpool attach in translate/llama.rs reads the context pointer from llama-cpp-2's
# Debug output (it exposes no raw pointer). Re-check that format before bumping either crate.
llama-cpp-2 = { version = "=0.1.160", optional = true }
llama-cpp-sys-2 = { version = "=0.1.160", optional = true }
encoding_rs = { version = "0.8", optional = true }
self_cell = { version = "1", optional = true }
hf-hub = { git = "https://github.com/huggingface/hf-hub", branch = "main", default-features = false, optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
futures = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
# NDK binaries can't link the platform's private OpenSSL (BoringSSL); build one for `tls-native`.
openssl = { version = "0.10", features = ["vendored"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "time", "test-util"] }

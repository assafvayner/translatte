[package]
name = "translatte-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "translatte_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[features]
# In-app model downloads.
download = ["translatte-core/download", "translatte-core/tls-rustls"]

[dependencies]
translatte-core = { path = "../core", features = ["llama"] }
image.workspace = true
thiserror.workspace = true
uniffi = { version = "0.29", features = ["cli"] }

# sysinfo 0.39 (via hf-xet) imports libc::RTM_IFINFO2, which libc 0.2.190 and 0.2.191 only declare
# for macOS. Cargo.lock holds one libc for every target, so this pins it everywhere, not just on iOS;
# drop it once sysinfo or libc fixes the iOS build.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
# Must resolve to the same version reqwest uses, so the JNI init below reaches its verifier.
rustls-platform-verifier = "0.7"
paranoid-android = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "env-filter"] }

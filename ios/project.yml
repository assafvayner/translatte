name: Translatte
options:
  bundleIdPrefix: co.huggingface
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Translatte:
    type: application
    platform: iOS
    sources:
      - path: Translatte
      - path: ../models/manifest.json
        buildPhase: resources
    dependencies:
      - framework: Frameworks/TranslatteFFI.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: Foundation.framework
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: CoreML.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.huggingface.translatte
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Translatte
        INFOPLIST_KEY_NSCameraUsageDescription: Translatte reads text in photos you take so it can translate it on your device.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        # The translation model is ~2.5GB; without this entitlement iOS kills the app on device.
        CODE_SIGN_ENTITLEMENTS: Translatte/Translatte.entitlements
        OTHER_LDFLAGS: ["-lc++"]
        DEAD_CODE_STRIPPING: YES
  TranslatteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TranslatteTests
    dependencies:
      - target: Translatte
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Translatte.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Translatte"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Translatte:
    build:
      targets:
        Translatte: all
        TranslatteTests: [test]
    test:
      targets:
        - TranslatteTests
      environmentVariables:
        TRANSLATTE_MODELS: $(TRANSLATTE_MODELS)
        TRANSLATTE_REPO: $(SRCROOT)/..
